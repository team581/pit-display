name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      update_visual_snapshots:
        description: Generate Linux visual baselines and upload them for review
        required: false
        default: false
        type: boolean

jobs:
  build-and-test:
    name: Build and test
    timeout-minutes: 5
    runs-on: ubuntu-latest
    env:
      VITE_CONVEX_URL: https://stoic-mouse-746.convex.cloud
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
      - run: vp check
      - run: vp run test:unit
      - run: vp exec knip
      - run: vp run build
      - run: vp run storybook:build

  visual-tests:
    name: Visual tests
    timeout-minutes: 10
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
      - name: Install WebKit
        run: vp exec playwright install --with-deps webkit
      - name: Compare visual snapshots
        if: ${{ !inputs.update_visual_snapshots }}
        run: vp test --project visual --reporter=default --reporter=html --outputFile.html=.vitest/html/index.html
        env:
          VISUAL_TESTS: 'true'
      - name: Generate visual snapshots
        if: ${{ inputs.update_visual_snapshots }}
        run: vp test --project visual --update
        env:
          VISUAL_TESTS: 'true'
      - name: Upload Vitest report
        id: upload-report
        if: ${{ always() && !inputs.update_visual_snapshots }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vitest-visual-report
          path: .vitest
          include-hidden-files: true
      - name: Link Vitest report
        if: ${{ always() && !inputs.update_visual_snapshots && steps.upload-report.outputs.artifact-url }}
        run: echo "::notice title=Vitest visual report::$REPORT_URL"
        env:
          REPORT_URL: https://viewer.vitest.dev/?url=${{ steps.upload-report.outputs.artifact-url }}
      - name: Upload updated visual baselines
        if: ${{ inputs.update_visual_snapshots }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: visual-snapshots-linux
          path: src/**/__screenshots__/**/*-linux.png
