services:
  playwright:
    build:
      context: .
      dockerfile: Dockerfile.visual-tests
      args:
        PNPM_VERSION: ${PNPM_VERSION:?Set PNPM_VERSION from package.json}
        PLAYWRIGHT_VERSION: ${PLAYWRIGHT_VERSION:?Set PLAYWRIGHT_VERSION from package.json}
    init: true
    platform: linux/amd64
    ports:
      - '127.0.0.1:30781:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "const socket = require('node:net').connect(3000, '127.0.0.1', () => socket.end()); socket.on('error', () => process.exit(1));",
        ]
      interval: 1s
      timeout: 2s
      retries: 30
